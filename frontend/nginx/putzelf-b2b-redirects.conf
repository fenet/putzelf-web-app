# Include this file inside the HTTP and HTTPS server blocks for putzelf.com
# and www.putzelf.com. It retires legacy household routes and landing aliases
# directly to their approved destination on the canonical HTTPS host.

# Resolve important legacy aliases at the server before the SPA can load.
location = /imprint {
    return 301 https://putzelf.com/de/impressum$is_args$args;
}
location = /de/profile {
    return 301 https://putzelf.com/de/booking$is_args$args;
}
location = /en/profile {
    return 301 https://putzelf.com/en/booking$is_args$args;
}

location ~* ^/landing-alt/?$ {
    return 301 https://putzelf.com/de/$is_args$args;
}
location ~* ^/de/landing-alt/?$ {
    return 301 https://putzelf.com/de/$is_args$args;
}
location ~* ^/en/landing-alt/?$ {
    return 301 https://putzelf.com/en/$is_args$args;
}

location ~* ^/de/services/(wien|graz)/?$ {
    return 301 https://putzelf.com/de/services$is_args$args;
}
location ~* ^/de/(wien|graz)/services/?$ {
    return 301 https://putzelf.com/de/services$is_args$args;
}
location ~* ^/en/(vienna|graz)/services/?$ {
    return 301 https://putzelf.com/en/services$is_args$args;
}

location ~* ^/de/services/unterhaltsreinigung/?$ {
    return 301 https://putzelf.com/de/services/unterhaltsreinigung-gewerbe$is_args$args;
}
location ~* ^/de/services/grundreinigung/?$ {
    return 301 https://putzelf.com/de/services/grundreinigung-gewerbe$is_args$args;
}
location ~* ^/de/services/bauendreinigung-grobreinigung/?$ {
    return 301 https://putzelf.com/de/services/bauendreinigung-grobreinigung-gewerbe$is_args$args;
}
location ~* ^/de/services/glas-rahmenreinigung/?$ {
    return 301 https://putzelf.com/de/services/glas-rahmenreinigung-gewerbe$is_args$args;
}
location ~* ^/de/services/industriereinigung-maschinen/?$ {
    return 301 https://putzelf.com/de/services/industriereinigung-maschinen-gewerbe$is_args$args;
}
location ~* ^/de/services/wohnreinigung/?$ {
    return 410;
}

location ~* ^/en/services/maintenance-cleaning/?$ {
    return 301 https://putzelf.com/en/services/maintenance-cleaning-business$is_args$args;
}
location ~* ^/en/services/deep-cleaning-private/?$ {
    return 301 https://putzelf.com/en/services/deep-cleaning-business$is_args$args;
}
location ~* ^/en/services/construction-cleaning/?$ {
    return 301 https://putzelf.com/en/services/construction-cleaning-business$is_args$args;
}
location ~* ^/en/services/window-cleaning/?$ {
    return 301 https://putzelf.com/en/services/window-cleaning-business$is_args$args;
}
location ~* ^/en/services/industrial-cleaning/?$ {
    return 301 https://putzelf.com/en/services/industrial-cleaning-business$is_args$args;
}
location ~* ^/en/services/residential-cleaning/?$ {
    return 410;
}

location = /calculator {
    return 301 https://putzelf.com/de/booking$is_args$args;
}
location ~* ^/calculator/$ {
    return 301 https://putzelf.com/de/booking$is_args$args;
}
location ~* ^/(de|en)/calculator/?$ {
    return 301 https://putzelf.com/$1/booking$is_args$args;
}
